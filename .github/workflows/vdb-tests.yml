name: Run VDB Tests

on:
  workflow_call:

concurrency:
  group: vdb-tests-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: VDB ${{ matrix.store }} (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        store: [chroma, milvus, pgvecto_rs, pgvector, qdrant, weaviate, elasticsearch, couchbase, oceanbase, compatibility]
        include:
          - store: chroma
            tests: api/tests/integration_tests/vdb/chroma
            services: |
              chroma
          - store: milvus
            tests: api/tests/integration_tests/vdb/milvus
            services: |
              etcd
              minio
              milvus-standalone
          - store: pgvecto_rs
            tests: api/tests/integration_tests/vdb/pgvecto_rs
            services: |
              pgvecto-rs
          - store: pgvector
            tests: api/tests/integration_tests/vdb/pgvector
            services: |
              pgvector
          - store: qdrant
            tests: api/tests/integration_tests/vdb/qdrant
            services: |
              qdrant
          - store: weaviate
            tests: api/tests/integration_tests/vdb/weaviate
            services: |
              weaviate
          - store: elasticsearch
            tests: api/tests/integration_tests/vdb/elasticsearch
            services: |
              elasticsearch
          - store: couchbase
            tests: api/tests/integration_tests/vdb/couchbase
            services: |
              couchbase-server
          - store: oceanbase
            tests: api/tests/integration_tests/vdb/oceanbase
            services: |
              oceanbase
          - store: compatibility
            tests: api/tests/integration_tests/vdb/vikingdb api/tests/integration_tests/vdb/baidu api/tests/integration_tests/vdb/tcvectordb api/tests/integration_tests/vdb/upstash api/tests/integration_tests/vdb/tidb_vector api/tests/integration_tests/vdb/huawei
            services: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true

      - name: Setup UV and Python
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: api/uv.lock

      - name: Check UV lockfile
        run: uv lock --project api --check

      - name: Install dependencies
        run: uv sync --locked --project api --dev

      - name: Set up dotenvs
        run: |
          cp docker/.env.example docker/.env
          cp docker/middleware.env.example docker/middleware.env

      - name: Expose Service Ports
        run: sh .github/workflows/expose_service_ports.sh

      - name: Build the unavailable MinIO fixture from pinned upstream source
        if: matrix.store == 'milvus'
        run: |
          docker build -f .github/scripts/minio-ci.Dockerfile -t dify-ci-minio:2023-03-20 .github/scripts
          yq eval '.services.minio.image = "dify-ci-minio:2023-03-20"' -i docker/docker-compose.yaml

      - name: Start isolated vector store
        if: matrix.services != ''
        uses: hoverkraft-tech/compose-action@v2.0.2
        with:
          compose-file: docker/docker-compose.yaml
          services: ${{ matrix.services }}

      - name: setup test config
        run: |
          cp api/tests/integration_tests/.env.example api/tests/integration_tests/.env

      - name: Test vector store
        env:
          VDB_TEST_PATHS: ${{ matrix.tests }}
        run: |
          read -r -a tests <<< "$VDB_TEST_PATHS"
          uv run --project api pytest --timeout "${PYTEST_TIMEOUT:-180}" "${tests[@]}"
