name: Main CI Pipeline

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: write
  checks: write
  statuses: write

concurrency:
  group: main-ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Check which paths were changed to determine which tests to run
  check-changes:
    name: Check Changed Files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api-changed: ${{ steps.changes.outputs.api }}
      web-changed: ${{ steps.changes.outputs.web }}
      vdb-changed: ${{ steps.changes.outputs.vdb }}
      migration-changed: ${{ steps.changes.outputs.migration }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - id: changes
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: python3 .github/scripts/ci.py plan

  # Run tests in parallel
  api-tests:
    name: API Tests
    needs: check-changes
    if: needs.check-changes.outputs.api-changed == 'true'
    uses: ./.github/workflows/api-tests.yml

  web-tests:
    name: Web Tests
    needs: check-changes
    if: needs.check-changes.outputs.web-changed == 'true'
    uses: ./.github/workflows/web-tests.yml

  style-check:
    name: Style Check
    needs: check-changes
    if: needs.check-changes.outputs.api-changed == 'true' || needs.check-changes.outputs.web-changed == 'true'
    with:
      api: ${{ needs.check-changes.outputs.api-changed == 'true' }}
      web: ${{ needs.check-changes.outputs.web-changed == 'true' }}
    uses: ./.github/workflows/style.yml

  vdb-tests:
    name: VDB Tests
    needs: check-changes
    if: needs.check-changes.outputs.vdb-changed == 'true'
    uses: ./.github/workflows/vdb-tests.yml

  db-migration-test:
    name: DB Migration Test
    needs: check-changes
    if: needs.check-changes.outputs.migration-changed == 'true'
    uses: ./.github/workflows/db-migration-test.yml

  check:
    name: PR checks
    needs: [check-changes, api-tests, web-tests, style-check, vdb-tests, db-migration-test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci.py gate
